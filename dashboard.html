<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<title>Check-In Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Leaflet: free maps, no API key. Loaded before the module so `L` is global. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --ink:#14161A; --label:#FBFBF9; --field:#DDE1E6; --rule:#B9BFC7;
  --muted:#616872; --safety:#FFD100; --pass:#0A6E3B; --reject:#C0132A; --wait:#B45309;
  --step:4px;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body{ font-family:'IBM Plex Sans Condensed','Roboto Condensed',system-ui,sans-serif;
  background:var(--field); color:var(--ink); min-height:100dvh; -webkit-text-size-adjust:100%; }

/* ---------- LOGIN ---------- */
#login{ min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:calc(var(--step)*3); }
#login .card{ width:100%; max-width:380px; background:var(--label); border:2px solid var(--ink); }
#login .head{ background:var(--ink); color:var(--label); padding:calc(var(--step)*3) calc(var(--step)*4);
  font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:15px; }
#login .body{ padding:calc(var(--step)*5) calc(var(--step)*4); display:flex; flex-direction:column; gap:calc(var(--step)*4); }
#login .cap{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:calc(var(--step)*1.5); }
#login input{ width:100%; border:2px solid var(--ink); background:var(--label);
  font-family:'IBM Plex Mono',monospace; font-size:18px; padding:calc(var(--step)*3); }
#login input:focus{ outline:3px solid var(--safety); outline-offset:2px; }
#login button{ border:2px solid var(--ink); background:var(--safety); color:var(--ink);
  font-family:inherit; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  font-size:18px; min-height:64px; cursor:pointer; }
#login button:disabled{ background:var(--field); color:var(--rule); border-color:var(--rule); cursor:progress; }
#login .msg{ font-size:13px; color:var(--reject); font-weight:600; min-height:1.2em; }

/* ---------- APP ---------- */
#app{ display:none; flex-direction:column; min-height:100dvh; }
.bar{ background:var(--ink); color:var(--label); display:flex; align-items:center;
  justify-content:space-between; padding:calc(var(--step)*3) calc(var(--step)*4); position:sticky; top:0; z-index:500; }
.bar .t{ font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:15px; }
.bar .tools{ display:flex; gap:calc(var(--step)*2); }
.bar button{ font-family:inherit; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--label); background:transparent; color:var(--label); padding:6px 10px; cursor:pointer; }
.bar button:active{ background:var(--label); color:var(--ink); }

#map{ height:38vh; min-height:240px; width:100%; background:var(--field); border-bottom:2px solid var(--ink); z-index:1; }

.controls{ display:flex; gap:calc(var(--step)*2); flex-wrap:wrap; align-items:center;
  padding:calc(var(--step)*3) calc(var(--step)*4); background:var(--label); border-bottom:1px solid var(--rule); }
.controls select, .controls input{ font-family:'IBM Plex Sans Condensed',sans-serif; font-size:13px;
  border:2px solid var(--ink); background:var(--label); padding:7px 9px; }
.controls .count{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
.controls .csv{ border:2px solid var(--ink); background:var(--pass); color:#fff; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; font-size:12px; padding:7px 12px; cursor:pointer; }

/* date scope bar */
.datebar{ display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  padding:calc(var(--step)*3) calc(var(--step)*4); background:var(--label);
  border-bottom:1px solid var(--rule); }
.datebar input[type=date]{ font-family:'IBM Plex Mono',monospace; font-size:13px;
  border:2px solid var(--ink); background:var(--label); color:var(--ink); padding:6px 8px; }
.datebar button{ font-family:'IBM Plex Sans Condensed',sans-serif; font-weight:700;
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  border:2px solid var(--ink); background:var(--label); color:var(--ink);
  padding:7px 10px; cursor:pointer; }
.datebar button.on{ background:var(--safety); }
.datebar .scope{ margin-left:auto; font-family:'IBM Plex Mono',monospace;
  font-size:12px; color:var(--muted); }

/* team color-key chips (also the filter + live counts) */
.chips{ display:flex; gap:6px; flex-wrap:wrap; padding:calc(var(--step)*3) calc(var(--step)*4);
  background:var(--label); border-bottom:1px solid var(--rule); }
.chip{ display:inline-flex; align-items:center; gap:6px; border:2px solid var(--rule);
  background:var(--label); padding:5px 9px; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; color:var(--ink); }
.chip .sw{ width:12px; height:12px; border:1px solid var(--ink); flex:0 0 12px; }
.chip .ct{ color:var(--muted); font-weight:400; }
.chip.on{ border-color:var(--ink); background:var(--field); }
.chip.zero{ opacity:.4; }            /* a team with no check-ins yet = easy to spot */
.chip.all .sw{ background:var(--ink); }

.list{ flex:1; background:var(--label); }
.state{ padding:calc(var(--step)*8) calc(var(--step)*4); text-align:center; color:var(--muted); font-size:14px; }

.row{ display:grid; grid-template-columns:1.4fr 1.3fr auto; gap:calc(var(--step)*2) calc(var(--step)*3);
  align-items:center; padding:calc(var(--step)*3) calc(var(--step)*4); border-bottom:1px dashed var(--rule); cursor:pointer; }
.row:active{ background:var(--field); }
.row .team{ font-weight:700; font-size:15px; font-family:'IBM Plex Mono',monospace; }
.row .when{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
.row .acc{ font-family:'IBM Plex Mono',monospace; font-size:12px; }
.row .acc .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.row .acc .dot.good{ background:var(--pass); } .row .acc .dot.mid{ background:var(--wait); } .row .acc .dot.bad{ background:var(--reject); }
.row .coords{ grid-column:1 / 3; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
.row .go{ grid-row:1 / 3; align-self:center; border:2px solid var(--ink); background:var(--safety);
  font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:8px 10px; text-decoration:none; color:var(--ink); }

.leaflet-popup-content{ font-family:'IBM Plex Sans Condensed',sans-serif; font-size:13px; }
.leaflet-popup-content b{ font-weight:700; }
.leaflet-popup-content .mono{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }

@media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="card">
    <div class="head">Dashboard · Sign In</div>
    <div class="body">
      <div>
        <div class="cap">Email</div>
        <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="you@email.com" />
      </div>
      <div>
        <div class="cap">Password</div>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button id="loginBtn" type="button">Unlock</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="bar">
    <span class="t">Check-In Dashboard</span>
    <div class="tools">
      <button id="refresh" type="button">Refresh</button>
      <button id="logout" type="button">Sign Out</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- date scope: pick a day, or All. Filters map + list + chips + CSV. -->
  <div class="datebar">
    <input type="date" id="datePick" />
    <button id="todayBtn" type="button">Today</button>
    <button id="allBtn" type="button">All dates</button>
    <span class="scope" id="scope">—</span>
  </div>

  <!-- team color-key + tap-to-filter + live counts -->
  <div class="chips" id="teamChips"></div>

  <div class="controls">
    <select id="sortBy">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="team">By route team</option>
      <option value="accuracy">Best accuracy</option>
    </select>
    <button class="csv" id="csvBtn" type="button">Download CSV</button>
    <span class="count" id="count">—</span>
  </div>

  <div class="list" id="list">
    <div class="state" id="state">Loading check-ins…</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

/* ============================================================
   YOUR FIREBASE CONFIG — already filled in (check-in-4eb56).
   Public is fine: your Firestore RULES + this login are the lock.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDzvxKptm26YrTLGnLBQVWA3bsxW_BdUqo",
  authDomain: "check-in-4eb56.firebaseapp.com",
  projectId: "check-in-4eb56",
  storageBucket: "check-in-4eb56.firebasestorage.app",
  messagingSenderId: "234001919198",
  appId: "1:234001919198:web:bb960c425745a6e2ac264f",
};
const COLLECTION = "checkins";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const $ = id => document.getElementById(id);

let rows = [];          // all check-ins, as {name, lat, lng, accuracyM, when(Date|null)}
let map = null, markers = null;
let activeTeam = "";     // "" = show all teams; set by tapping a chip
let activeDate = "";     // "" = ALL dates; otherwise "YYYY-MM-DD" (local)

// Local calendar-day key. Uses the phone's timezone, NOT UTC, so "today"
// means today where you are — not a day that flips at 5pm.
function dateKey(d){
  if (!d) return "";
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayKey(){ return dateKey(new Date()); }

// Pretty label for the scope readout, e.g. "Mon, Jul 28".
function prettyDate(key){
  if (!key) return "All dates";
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" });
}

// Fixed color per route team. Deliberately NOT green/amber/red — those mean
// ACCURACY in the list dots, and one color can't mean two things. Unknown
// teams fall back to grey.
const KNOWN_TEAMS = ["RT11", "RT12", "RT13", "RT27", "RT30"];
const TEAM_COLORS = {
  RT11: "#1E6FD9", RT12: "#8A3FFC", RT13: "#0FB5AE", RT27: "#E8710A", RT30: "#C0398F",
};
function teamColor(t){ return TEAM_COLORS[t] || "#616872"; }

// Mirror of the driver-page rule: "12"/"rt12"/"RT 12" -> "RT12". Applied on
// read so old bare-number check-ins and new clean ones land as one team.
function normalizeTeam(raw){
  const up = String(raw).trim().toUpperCase();
  const digits = up.replace(/\D/g, "");
  return digits ? "RT" + digits : up;
}


/* ============================================================
   AUTH — the gate. onAuthStateChanged fires on load and on every
   sign-in/out, so it's the single source of truth for "show app".
   ============================================================ */
onAuthStateChanged(auth, user => {
  if (user){
    $("login").style.display = "none";
    $("app").style.display = "flex";
    activeDate = todayKey();      // open on TODAY; tap "All dates" for full history
    initMap();
    loadData();
  } else {
    $("app").style.display = "none";
    $("login").style.display = "flex";
  }
});

$("loginBtn").addEventListener("click", doLogin);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin(){
  const email = $("email").value.trim();
  const pw = $("pw").value;
  const btn = $("loginBtn");
  $("loginMsg").textContent = "";
  if (!email || !pw){ $("loginMsg").textContent = "Enter your email and password."; return; }

  btn.disabled = true; btn.textContent = "Checking…";
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    // onAuthStateChanged takes over from here.
  } catch (err) {
    // Friendly messages for the common cases.
    const m = {
      "auth/invalid-credential": "Wrong email or password.",
      "auth/invalid-email": "That email doesn't look right.",
      "auth/user-not-found": "No account with that email. Create one in the Firebase console.",
      "auth/wrong-password": "Wrong password.",
      "auth/too-many-requests": "Too many tries. Wait a minute and retry.",
      "auth/unauthorized-domain": "This site isn't in Firebase's Authorized Domains yet. Add it in Authentication → Settings.",
    };
    $("loginMsg").textContent = m[err.code] || ("Sign-in failed: " + err.code);
  } finally {
    btn.disabled = false; btn.textContent = "Unlock";
  }
}

$("logout").addEventListener("click", () => signOut(auth));


/* ============================================================
   MAP — Leaflet + free OpenStreetMap tiles. circleMarkers avoid
   the missing-pin-image problem entirely.
   ============================================================ */
function initMap(){
  if (map) return;                        // build once
  // Start over Western Washington (Seattle–Tacoma–Olympia). Once real
  // check-ins load, fitBounds() below re-frames to wherever the pins are,
  // so this only matters on the very first, empty load.
  map = L.map("map").setView([47.25, -122.45], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap",
  }).addTo(map);
  markers = L.layerGroup().addTo(map);
}

function drawMarkers(list){
  markers.clearLayers();
  const pts = [];
  list.forEach(r => {
    if (typeof r.lat !== "number" || typeof r.lng !== "number") return;
    // Pin color = TEAM (accuracy still shown in the list dot + popup).
    const color = teamColor(r.routeTeam);
    const m = L.circleMarker([r.lat, r.lng], {
      radius: 8, color: "#14161A", weight: 2, fillColor: color, fillOpacity: 0.9,
    }).bindPopup(
      `<b>${escapeHtml(r.routeTeam)}</b><br>${fmtWhen(r.when)}<br>` +
      `<span class="mono">±${r.accuracyM ?? "?"} m · ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</span>`
    );
    m._row = r;
    markers.addLayer(m);
    pts.push([r.lat, r.lng]);
  });
  if (pts.length){
    map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
  }
}

// Pan to a specific check-in and open its popup (called from a list tap).
function focusOn(r){
  if (typeof r.lat !== "number") return;
  map.setView([r.lat, r.lng], 15);
  markers.eachLayer(m => { if (m._row === r) m.openPopup(); });
  window.scrollTo({ top: 0, behavior: "smooth" });
}


/* ============================================================
   DATA — read the collection, newest first.
   ============================================================ */
async function loadData(){
  setState("Loading check-ins…");
  try {
    const snap = await getDocs(query(collection(db, COLLECTION), orderBy("serverTime", "desc")));
    rows = snap.docs.map(d => {
      const x = d.data();
      // serverTime is a Firestore Timestamp; may be null for a split second
      // right after a write. Fall back to the device time if so.
      const when = x.serverTime?.toDate ? x.serverTime.toDate()
                 : (x.deviceTime ? new Date(x.deviceTime) : null);
      return {
        // Normalize on read so a bare "12" is treated as "RT12" — this fixes
      // check-ins that came in before the driver-page fix, at the viewing layer.
      routeTeam: normalizeTeam(x.routeTeam || x.name || "(unknown)"),
        lat: typeof x.lat === "number" ? x.lat : null,
        lng: typeof x.lng === "number" ? x.lng : null,
        accuracyM: x.accuracyM ?? null,
        when,
      };
    });
    render();   // render() builds the chips from the date-filtered set
  } catch (err) {
    // The usual culprit: rules still block reads. Tell them exactly that.
    if (err.code === "permission-denied"){
      setState("Can't read data — your Firestore rules still block reads. Publish the updated rule (allow read if signed in).");
    } else {
      setState("Couldn't load data: " + (err.code || err.message));
    }
    console.error(err);
  }
}

$("refresh").addEventListener("click", loadData);
$("sortBy").addEventListener("change", render);

/* ---- date scope controls ---- */
$("datePick").addEventListener("change", () => { activeDate = $("datePick").value || ""; render(); });
$("todayBtn").addEventListener("click", () => { activeDate = todayKey(); render(); });
$("allBtn").addEventListener("click",   () => { activeDate = "";        render(); });

// Keep the date box, the two buttons, and the scope label agreeing with state.
function syncDateUI(){
  $("datePick").value = activeDate;                    // empty box when showing All
  $("todayBtn").classList.toggle("on", activeDate === todayKey());
  $("allBtn").classList.toggle("on", activeDate === "");
  $("scope").textContent = prettyDate(activeDate);
}


/* ============================================================
   RENDER — filter + sort + paint list + markers.
   ============================================================ */
function render(){
  const team = activeTeam;
  const sort = $("sortBy").value;

  // 1) narrow to the selected day (or all days), 2) then to the selected team.
  // Chip counts are built from the DATE-filtered set, so a chip shows how many
  // check-ins that team has on the day you're looking at.
  const dateFiltered = rows.filter(r => !activeDate || dateKey(r.when) === activeDate);
  buildChips(dateFiltered);
  syncDateUI();

  let view = dateFiltered.filter(r => !team || r.routeTeam === team);

  view.sort((a, b) => {
    if (sort === "oldest") return (a.when?.getTime() || 0) - (b.when?.getTime() || 0);
    if (sort === "team") return a.routeTeam.localeCompare(b.routeTeam) || (b.when?.getTime() || 0) - (a.when?.getTime() || 0);
    if (sort === "accuracy") return (a.accuracyM ?? 1e9) - (b.accuracyM ?? 1e9);
    return (b.when?.getTime() || 0) - (a.when?.getTime() || 0);   // newest
  });

  $("count").textContent = view.length + (view.length === 1 ? " check-in" : " check-ins");
  drawMarkers(view);

  const list = $("list");
  if (!rows.length){ setState("No check-ins yet. Once a route team taps Send, rows appear here."); return; }
  if (!view.length){
    setState(activeDate
      ? `No check-ins on ${prettyDate(activeDate)}${activeTeam ? " for " + activeTeam : ""}.`
      : "No check-ins for that route team.");
    return;
  }

  list.innerHTML = "";
  view.forEach(r => {
    const el = document.createElement("div");
    el.className = "row";
    el.style.borderLeft = "6px solid " + teamColor(r.routeTeam);
    const hasLoc = typeof r.lat === "number";
    const maps = hasLoc ? `https://www.google.com/maps?q=${r.lat},${r.lng}` : "#";
    el.innerHTML = `
      <div class="team">${escapeHtml(r.routeTeam)}</div>
      <div class="when">${fmtWhen(r.when)}</div>
      <a class="go" href="${maps}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Maps ↗</a>
      <div class="acc"><span class="dot ${accClass(r.accuracyM)}"></span>±${r.accuracyM ?? "?"} m</div>
      <div class="coords">${hasLoc ? r.lat.toFixed(6) + ", " + r.lng.toFixed(6) : "no location"}</div>
    `;
    el.addEventListener("click", () => focusOn(r));
    list.appendChild(el);
  });
}

// Build the color-key chips: "ALL" + every known team (always shown, so a
// team with zero check-ins is visibly missing) + any unexpected team in data.
function buildChips(scopeRows){
  const wrap = $("teamChips");
  wrap.innerHTML = "";

  const counts = {};
  scopeRows.forEach(r => { counts[r.routeTeam] = (counts[r.routeTeam] || 0) + 1; });

  wrap.appendChild(makeChip("", "ALL", scopeRows.length, null));
  KNOWN_TEAMS.forEach(t => wrap.appendChild(makeChip(t, t, counts[t] || 0, teamColor(t))));
  Object.keys(counts).filter(t => !KNOWN_TEAMS.includes(t)).sort()
    .forEach(t => wrap.appendChild(makeChip(t, t, counts[t], teamColor(t))));

  markActiveChip();
}

function makeChip(team, label, count, color){
  const c = document.createElement("button");
  c.type = "button";
  c.className = "chip" + (team === "" ? " all" : "") + (team && count === 0 ? " zero" : "");
  c.dataset.team = team;
  c.innerHTML =
    (team === "" ? `<span class="sw"></span>` : `<span class="sw" style="background:${color}"></span>`) +
    `<span>${escapeHtml(label)}</span><span class="ct">${count}</span>`;
  c.addEventListener("click", () => {
    // tapping the already-active team (or ALL) returns to all teams
    activeTeam = (activeTeam === team) ? "" : team;
    render();
  });
  return c;
}

function markActiveChip(){
  $("teamChips").querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("on", c.dataset.team === activeTeam);
  });
}


/* ============================================================
   CSV — build from the currently filtered/sorted view.
   ============================================================ */
$("csvBtn").addEventListener("click", () => {
  // Same scope you're looking at: selected date + selected team.
  const scoped = rows.filter(r =>
    (!activeDate || dateKey(r.when) === activeDate) &&
    (!activeTeam || r.routeTeam === activeTeam)
  );
  if (!scoped.length) return;

  // Group by team, then order each team's stops OLDEST -> NEWEST. Gaps and
  // distances only make sense forward in time, within one team's own route.
  const byTeam = {};
  scoped.forEach(r => { (byTeam[r.routeTeam] = byTeam[r.routeTeam] || []).push(r); });
  Object.values(byTeam).forEach(list =>
    list.sort((a, b) => (a.when?.getTime() || 0) - (b.when?.getTime() || 0))
  );

  const header = [
    "route_team", "date", "time", "stop_no",
    "gap_min", "distance_mi_straight_line", "cumulative_mi",
    "accuracy_m", "lat", "lng", "note",
  ];
  const lines = [header.join(",")];
  const summary = [];

  Object.keys(byTeam).sort().forEach(team => {
    const list = byTeam[team];
    let prev = null, cumMi = 0, totalMin = 0;

    list.forEach((r, i) => {
      let gapMin = "", distMi = "", note = "";

      if (prev) {
        // minutes between this scan and that team's previous scan
        if (prev.when && r.when) {
          const mins = (r.when - prev.when) / 60000;
          gapMin = mins.toFixed(1);
          totalMin += mins;
        }
        // straight-line miles between the two GPS points
        if (typeof prev.lat === "number" && typeof r.lat === "number") {
          const mi = haversineMi(prev.lat, prev.lng, r.lat, r.lng);
          distMi = mi.toFixed(2);
          cumMi += mi;
        }
        // flag an overnight jump so a new workday isn't read as one long run
        if (prev.when && r.when && dateKey(prev.when) !== dateKey(r.when)) note = "new day";
      } else {
        note = "route start";
      }

      lines.push([
        csv(team),
        csv(r.when ? dateKey(r.when) : ""),
        csv(r.when ? r.when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""),
        i + 1,
        gapMin,
        distMi,
        cumMi ? cumMi.toFixed(2) : "",
        r.accuracyM ?? "",
        r.lat ?? "",
        r.lng ?? "",
        csv(note),
      ].join(","));
    });

    summary.push([
      csv(team), list.length, cumMi.toFixed(2),
      totalMin.toFixed(0), (totalMin / 60).toFixed(2),
    ].join(","));
  });

  // Blank line, then a totals block. Keeps the main table clean for sorting.
  lines.push("");
  lines.push("SUMMARY (straight-line distance; not road miles)");
  lines.push(["route_team", "stops", "total_mi", "total_min", "total_hours"].join(","));
  summary.forEach(l => lines.push(l));

  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const scope = (activeDate || "all-dates") + (activeTeam ? "_" + activeTeam : "");
  a.href = url; a.download = `checkins_${scope}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});


/* ============================================================
   HELPERS
   ============================================================ */
// Great-circle distance in MILES. Straight-line ("as the crow flies") — it is
// NOT driving distance, which would need a paid routing service. Consistent
// across every row, so it is honest for comparing stops and teams.
function haversineMi(lat1, lng1, lat2, lng2){
  const R = 3958.7613;                       // Earth radius in miles
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function accClass(m){ if (m == null) return "bad"; if (m <= 30) return "good"; if (m <= 100) return "mid"; return "bad"; }
function accColor(m){ if (m == null) return "#C0132A"; if (m <= 30) return "#0A6E3B"; if (m <= 100) return "#B45309"; return "#C0132A"; }

function fmtWhen(d){
  if (!d) return "—";
  return d.toLocaleString([], { weekday:"short", hour:"2-digit", minute:"2-digit", month:"short", day:"numeric" });
}
function setState(msg){ $("list").innerHTML = `<div class="state">${escapeHtml(msg)}</div>`; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function csv(s){ const t = String(s); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }
</script>
